name: PeachTVPlus
# Nom affiché de l'app = « PeachTV+ » (CFBundleDisplayName).
# Identifiant Xcode interne sanitisé (« PeachTVPlus », sans « + » ni espace) car
# XcodeGen / xcodebuild / les schémas tolèrent mal « + » dans un nom de cible.
# Le dossier du dépôt reste « PeachTV+_iPhone » comme demandé par l'utilisateur.

options:
  bundleIdPrefix: com.peachtvplus
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "15.4"

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: "" # renseigné par la CI / l'utilisateur au moment de signer (M7)
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

# Dépendances SPM réintroduites à leur jalon (chacune validée par la CI à ce
# moment-là, puisqu'on ne compile pas sous Windows) :
#   M2 — GRDB.swift (cache SQLite + FTS5)   ← ACTIVÉE à ce jalon
#   M3 — MobileVLCKit (lecture MPEG-TS/HEVC/AC3) + Nuke/NukeUI (images)
#   M6 — swift-snapshot-testing (tests visuels)
# Voir docs/PORT-SPEC.md §2. Le build M0/M1 restait SANS dépendance externe pour
# obtenir un premier CI vert fiable ; M2 introduit la 1re dépendance (GRDB).

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    # upToNextMajor : >= 6.x, < 7.0 (GRDB 7 vise Swift 6 / concurrence stricte —
    # on reste sur la 6.x stable tant qu'aucun Mac ne permet d'itérer le build).
    from: "6.0.0"
  # M3b — VLCKit empaqueté en Swift Package (binaire xcframework). Lit le MPEG-TS brut,
  # HEVC, AC3/DTS qu'AVPlayer refuse. Produit ET module = « VLCKitSPM » (import VLCKitSPM).
  # Tag stable 3.6.0 = xcframework « all » (iOS device + simulateur). ⚠️ la présence de la
  # tranche simulateur arm64 n'est validable que par la CI macOS → tout le code VLC est
  # derrière `#if canImport(VLCKitSPM)` avec repli AVPlayer si le module manque.
  VLCKitSPM:
    url: https://github.com/tylerjonesio/vlckit-spm
    from: "3.6.0"

targets:
  PeachTVPlus:
    type: application
    platform: iOS
    sources:
      - path: Sources/PeachTVPlus
    dependencies:
      - package: GRDB
      - package: VLCKitSPM
        product: VLCKitSPM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peachtvplus.app
        TARGETED_DEVICE_FAMILY: "1,2" # iPhone + iPad
    info:
      path: Sources/PeachTVPlus/Info.plist
      properties:
        CFBundleDisplayName: PeachTV+
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - fetch
          - processing
          - audio   # M3b — poursuite de la lecture audio écran verrouillé / autre app.
        # ATS : le trafic en clair n'est PAS autorisé par principe. Les serveurs
        # Xtream en HTTP sont inconnus au build (saisis à l'exécution) → on garde
        # NSAllowsArbitraryLoads=true UNIQUEMENT pour ça ; le blocage réel du clair
        # sans consentement PAR SERVEUR est fait dans le code réseau (PORT-SPEC §5).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true

  PeachTVPlusTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/PeachTVPlusTests
    dependencies:
      - target: PeachTVPlus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peachtvplus.app.tests
        # XcodeGen ne génère pas d'Info.plist pour une cible de tests sans bloc
        # `info:`. Sans lui, xcodebuild échoue à la signature (« does not have an
        # Info.plist file ») → exit 65. On laisse Xcode en générer un.
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PeachTVPlus:
    build:
      targets:
        PeachTVPlus: all
        PeachTVPlusTests: [test]
    test:
      targets:
        - PeachTVPlusTests
      gatherCoverageData: true
